name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint + tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the docs reminder can diff commits
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run coverage
      - name: Upload coverage report
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  docs:
    name: Docs reminder (never fails)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Docs reminder
        run: bash scripts/check-docs.sh
