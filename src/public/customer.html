<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FoodGO — My lunch</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="topbar">
    <a class="wordmark" href="/customer">Food<span>GO</span></a>
    <div class="who"></div>
    <button id="signout" class="small">Sign out</button>
  </header>
  <main class="page narrow">
    <nav class="tabs" role="tablist">
      <button data-tab="restaurants" role="tab">Restaurants</button>
      <button data-tab="orders" role="tab">My orders</button>
    </nav>

    <section data-view="restaurants">
      <div id="restaurant-list"></div>
    </section>

    <section data-view="menu" hidden>
      <button class="secondary small" id="back">Back to restaurants</button>
      <h1 id="menu-title" style="margin-top:1rem"></h1>
      <div id="menu-deadline"></div>
      <div class="panel" id="menu-items"></div>
    </section>

    <section data-view="checkout" hidden>
      <button class="secondary small" id="back-to-menu">Back to the menu</button>
      <h1 style="margin-top:1rem">Your order</h1>
      <div class="panel">
        <p class="muted" id="checkout-restaurant"></p>
        <table class="lines" id="checkout-lines"></table>
        <h3>How do you want to pay?</h3>
        <div id="methods"></div>
        <p class="muted" id="checkout-deadline"></p>
        <button class="big" id="place-order">Place order</button>
      </div>
    </section>

    <section data-view="orders" hidden>
      <div id="order-list"></div>
    </section>
  </main>

  <div class="cartbar" id="cartbar" hidden>
    <span class="sum" id="cart-sum"></span>
    <button id="review">Review order</button>
  </div>
  <script type="module" src="/js/customer.js"></script>
</body>
</html>
