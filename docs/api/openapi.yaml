      description: Lists the caller's own assignments — open ones first, then newest assigned first, at most 50 (FR-20, BR-08). DELIVERY only.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: The caller's assignments.
          content:
            application/json:
              schema:
                type: object
                required: [assignments]
                properties:
                  assignments:
                    type: array
                    maxItems: 50
                    items:
                      $ref: '#/components/schemas/Assignment'
              example:
                assignments:
                  - assignmentId: asg_T4KQ9MX2RH7P
                    orderId: FG-7K2P9Q
                    status: ASSIGNED
                    orderStatus: ASSIGNED
                    orderStatusLabel: Delivery person assigned
                    customerName: Omar Trabelsi
                    destination: Lac 2 Tech Park
                    total: 24.5
                    paymentMethod: CASH_ON_DELIVERY
                    paymentStatus: PENDING
                    assignedAt: '2026-11-02T10:45:12.004Z'
                    completedAt: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /delivery/assignments/{assignmentId}:
    get:
      tags: [Delivery]
      operationId: getAssignmentDetail
      summary: One of my assignments
      description: Returns exactly what is needed to complete this delivery — items, pickup, customer contact and destination, amount to collect (FR-21, BR-08, BR-15; destination representation Q-02). DELIVERY only.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/AssignmentIdPath'
      responses:
        '200':
          description: The assignment detail.
          content:
            application/json:
              schema:
                type: object
                required: [assignment]
                properties:
                  assignment:
                    $ref: '#/components/schemas/AssignmentDetail'
              examples:
                assigned:
                  $ref: '#/components/examples/AssignmentAssignedBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /delivery/assignments/{assignmentId}/start:
    post:
      tags: [Delivery]
      operationId: startDelivery
      summary: Start the delivery
      description: The assignee starts the delivery; the assignment becomes STARTED and the order OUT_FOR_DELIVERY (UC-02, FR-22, BR-08, BR-10, I-9). DELIVERY only.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/AssignmentIdPath'
      responses:
        '200':
          description: The updated assignment detail.
          content:
            application/json:
              schema:
                type: object
                required: [assignment]
                properties:
                  assignment:
                    $ref: '#/components/schemas/AssignmentDetail'
              examples:
                started:
                  $ref: '#/components/examples/AssignmentStartedBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: DEL-001 — the delivery has already started (assignment not ASSIGNED) or the order transition is refused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: { code: DEL-001, message: This delivery has already started }
        '500':
          $ref: '#/components/responses/InternalError'

  /delivery/assignments/{assignmentId}/confirm:
    post:
      tags: [Delivery]
      operationId: confirmDelivery
      summary: Confirm the delivery
      description: The assignee confirms delivery in one transaction T3 — assignment COMPLETED, order DELIVERED, and for cash on delivery the payment is marked PAID only when cashCollected is true (UC-02, UC-03, FR-23, FR-26, BR-11). DELIVERY only.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/AssignmentIdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmDeliveryRequest'
            example:
              cashCollected: true
      responses:
        '200':
          description: The completed assignment detail.
          content:
            application/json:
              schema:
                type: object
                required: [assignment]
                properties:
                  assignment:
                    $ref: '#/components/schemas/AssignmentDetail'
              examples:
                completed:
                  $ref: '#/components/examples/AssignmentCompletedBody'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: DEL-001 — the delivery was not started (assignment not STARTED) or the order transition is refused (BR-11).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: { code: DEL-001, message: Start the delivery before confirming it }
        '500':
          $ref: '#/components/responses/InternalError'

