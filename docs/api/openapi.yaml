  /restaurants/{restaurantId}/forecast:
    get:
      tags: [Restaurant]
      operationId: getForecast
      summary: AI-assisted demand forecast and prep plan
      description: Advisory per-dish demand forecast for the next service day with an optional LLM summary; never changes orders, payments, eligibility or menu (FR-31 PROPOSED, BG-03, BG-04). STAFF of this restaurant only.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/RestaurantIdPath'
      responses:
        '200':
          description: The forecast. If the LLM is disabled or fails, `summary` falls back to a template (`summarySource` = `template`).
          content:
            application/json:
              schema:
                type: object
                required: [forecast]
                properties:
                  forecast:
                    $ref: '#/components/schemas/Forecast'
              example:
                forecast:
                  restaurantName: Dar Lella
                  serviceDate: '2026-11-02'
                  weekday: Monday
                  historyDays: 24
                  totals: { expected: 31, low: 24, high: 38, alreadyOrdered: 3 }
                  dishes:
                    - menuItemId: item_7TPM3KQ2XH9R
                      name: Couscous au poulet
                      available: true
                      expected: 7
                      low: 5
                      high: 9
                      confidence: high
                      alreadyOrdered: 1
                      samples: { sameWeekday: 4, recentDays: 7 }
                    - menuItemId: item_B2K9QX7MRT4H
                      name: "Brik à l'oeuf"
                      available: true
                      expected: 6
                      low: 4
                      high: 8
                      confidence: high
                      alreadyOrdered: 2
                      samples: { sameWeekday: 4, recentDays: 7 }
                  accuracy:
                    days:
                      - { day: '2026-10-31', predicted: 13, actual: 12, absError: 1 }
                      - { day: '2026-10-30', predicted: 27, actual: 30, absError: 3 }
                    meanAbsoluteError: 2.4
                    meanAbsolutePercentError: 9.8
                  note: null
                  method: Weighted average of the same weekday over the last 4 weeks (40/30/20/10 %), blended 60/40 with the last 7 service days.
                  summary: "Expect around 31 dishes on Monday (between 24 and 38). Prepare most of: Couscous au poulet (about 7), Brik à l'oeuf (about 6), Lablabi (about 5)."
                  summarySource: template
                  advisory: AI-assisted advice. The restaurant decides what to prepare.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenRestaurant'
        '500':
          $ref: '#/components/responses/InternalError'

