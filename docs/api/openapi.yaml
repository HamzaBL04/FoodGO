    post:
      tags: [Restaurant]
      operationId: registerCustomer
      summary: Register a customer in person
      description: Registers a customer after in-person identity verification; an existing person (same phone) only gains a membership, and a welcome SMS is sent (UC-04, FR-01–FR-04, BR-05, D-01, I-11). STAFF of this restaurant only.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/RestaurantIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterCustomerRequest'
            example:
              fullName: Omar Trabelsi
              phoneNumber: '+21698333444'
              organizationId: org_3RX7K2PQ9MTB
              eligible: true
              identityVerified: true
      responses:
        '201':
          description: Registered. `existingPerson` is true when the phone number already belonged to a FoodGO customer (only a membership was added).
          content:
            application/json:
              schema:
                type: object
                required: [customer]
                properties:
                  customer:
                    $ref: '#/components/schemas/RegisteredCustomer'
              example:
                customer:
                  customerId: cus_9QW4T7KPMX2H
                  fullName: Omar Trabelsi
                  phoneNumber: '+21698333444'
                  organizationId: org_3RX7K2PQ9MTB
                  organizationName: Lac 2 Tech Park
                  organizationType: WORKPLACE
                  eligible: true
                  status: ACTIVE
                  registeredAt: '2026-11-02T08:01:10.420Z'
                  existingPerson: false
        '400':
          description: VAL-001 — schema violation (including `identityVerified` not `true`, BR-05), unknown organization, or customer already registered at this restaurant.
