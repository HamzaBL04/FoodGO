                    error: { code: VAL-001, message: 'identityVerified: identity must be verified in person before registration (BR-05)' }
                duplicate:
                  value:
                    error: { code: VAL-001, message: This customer is already registered at your restaurant }
                organization:
                  value:
                    error: { code: VAL-001, message: Unknown organization }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenRestaurant'
        '404':
          $ref: '#/components/responses/NotFound'
