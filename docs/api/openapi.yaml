openapi: 3.0.3

info:
  title: FoodGO API
  version: 0.1.0
  description: |
    REST API of **FoodGO**, a pre-order food delivery platform for Tunisia: customers
    pre-order in the morning before the restaurant's ordering deadline, and the
    restaurant prepares and delivers at lunch with its own delivery personnel.

    ## Roles
    Every session has exactly one role:

    | Role | Signs in with | Scope |
    |---|---|---|
    | `CUSTOMER` | phone number + one-time SMS code (`/auth/otp/*`) | own profile, own orders, menus of the restaurants that registered them |
    | `STAFF` | identity + password (`/auth/signin`) | **own restaurant only** |
    | `DELIVERY` | identity + password (`/auth/signin`) | own delivery assignments only |
    | `ADMIN` | identity + password (`/auth/signin`) | platform administration (restaurants, staff accounts, monitoring); never orders |

    ## Authentication
    Send the session token either as `Authorization: Bearer <token>` or in the
    `fg_session` cookie (HttpOnly, SameSite=Lax, 12 h; set by sign-in). When both are
    present the `Authorization` header wins. An unknown or expired token is treated as
    "not signed in": routes that need a role answer `401 AUTH-001`; a signed-in caller
    with the wrong role gets `403 AUTH-002`.

    **Restaurant scope.** In every `/restaurants/{restaurantId}/...` path the
    `restaurantId` must be the calling staff member's own restaurant; any other value
    is refused with `403 AUTH-002` ("You can only act on your own restaurant"),
    even if that restaurant exists.

    ## Error model
    All errors (including unknown routes) share one JSON body:

    ```json
    { "error": { "code": "VAL-001", "message": "items: an order needs at least one item" } }
    ```

    | Code | HTTP | Meaning |
    |---|---|---|
    | `VAL-001` | 400 | Invalid input (schema violation, malformed JSON, business validation). Only the first issue is reported, as `<field path>: <message>`. |
    | `AUTH-001` | 401 | Not signed in / authentication failed. Also used (with HTTP 429) when the `/auth` rate limit is hit. |
    | `AUTH-002` | 403 | Authorization denied (wrong role, other restaurant, no membership). |
    | `NOT-FOUND` | 404 | Resource (or route) not found within the caller's scope. |
    | `ORDER-001` | 409 | Ordering deadline passed (BR-01). |
    | `ORDER-002` | 409 | A menu item is unavailable (BR-02). |
    | `ORDER-003` | 422 | Order creation failed (restaurant not taking orders). |
    | `PAY-001` | 402 | Payment failed / declined by the provider. |
    | `PAY-002` | 503 | Payment provider unavailable. |
    | `DEL-001` | 409 | Delivery operation or order status transition refused. |
    | `SYS-001` | 500 | Internal error (no stack trace or SQL is ever returned). |

    Request bodies are JSON (max 100 kB). Unknown body fields are ignored. String
    fields marked *trimmed* have surrounding whitespace removed before length and
    pattern checks.

    ## Money
    Amounts are Tunisian dinars (TND, 3 decimals; 1 TND = 1000 millimes). Fields such
    as `price`, `total`, `unitPrice` are JSON numbers in TND with at most 3 decimals;
    fields ending in `Millimes` are the exact integer amounts.

    ## Health check
    `GET /health` lives **outside** `/api/v1` (at the server root, no auth) and returns
    `{"status":"ok","time":"<ISO-8601>"}`. It is therefore not listed under `paths`.

servers:
  - url: /api/v1
    description: Same origin as the web app; all API routes are mounted under /api/v1.

tags:
  - name: Auth
    description: Sign-in (password and SMS OTP), sign-out and current session. Rate limited to 200 requests per 15 minutes per client.
  - name: Customer
    description: Customer Interface (SDD §5.1.2) — profile, registered restaurants and their menus.
  - name: Orders
    description: Order submission and tracking (customer) and the restaurant's order queue (staff).
  - name: Restaurant
    description: Restaurant Interface for STAFF (SDD §5.1.3) — settings, menu, customers, delivery personnel, forecast. The path restaurantId must be the caller's own restaurant.
  - name: Delivery
    description: Delivery Interface (SDD §5.1.4) — a delivery person's own assignments (BR-08).
  - name: Admin
    description: Platform administration (SDD §5.1.5) — restaurants, staff accounts, monitoring. ADMIN only.
  - name: Organizations
    description: Workplaces, campuses and institutions customers belong to (FR-04). STAFF and ADMIN.
  - name: Events
    description: Live order status stream over Server-Sent Events (FR-24).
  - name: Meta
    description: Service metadata.

paths:

  # ---------------------------------------------------------------- Meta
  /meta:
    get:
      tags: [Meta]
      operationId: getMeta
      summary: Service metadata
      description: Returns the service name, version and whether demo mode is on (SDD §2.2; demo mode per Q-22, §5.2.2). Public.
      security: []
      responses:
        '200':
          description: Service metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meta'
              example:
                name: FoodGO
                version: 0.1.0
                demoMode: true
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------------------------------------------------------------- Auth
  /auth/signin:
    post:
      tags: [Auth]
      operationId: signIn
      summary: Password sign-in (staff, delivery, admin)
      description: Signs in a STAFF, DELIVERY or ADMIN account with identity and password and sets the fg_session cookie (SDD §5.2.1, §5.3). Public.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
            example:
              role: STAFF
              identity: staff@darlella.tn
              password: 'Staff#2026'
      responses:
        '200':
          description: Signed in. The token is returned in the body and also set as the `fg_session` cookie.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInResponse'
              example:
                token: 3q2-7wEXAMPLEtokenBase64Url_Hq9vK1mZ0aL4sT8uYcR2dN6
                session:
                  role: STAFF
                  subjectId: stf_8MZQ4RTK2HXA
                  restaurantId: rst_4H7KQ2M9XPTB
                  fullName: Sonia Gharbi
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: AUTH-001 — invalid identity or password, or the account is not active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: { code: AUTH-001, message: Invalid identity or password }
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/otp/request:
    post:
      tags: [Auth]
      operationId: requestOtp
      summary: Request a customer sign-in code by SMS
      description: Step 1 of customer sign-in — sends a 6-digit one-time code by SMS to a phone number registered in person by a restaurant (BR-05, FR-03). Public.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
            example:
              phoneNumber: '+21698333444'
      responses:
        '201':
          description: |
            Challenge created and code sent. The code is valid for 5 minutes and allows
            at most 5 verification attempts. `demoCode` is present **only when the server
            runs in demo mode** (no real SMS provider integrated, Q-22).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpChallenge'
              examples:
                demoMode:
                  summary: Demo mode (code echoed)
                  value:
                    challengeId: otp_K7M2QX9RT4HB
                    expiresInSeconds: 300
                    demoCode: '482913'
                production:
                  summary: Demo mode off
                  value:
                    challengeId: otp_K7M2QX9RT4HB
                    expiresInSeconds: 300
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: AUTH-001 — the phone number is unknown, the customer is not active, or has no active eligible restaurant membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: AUTH-001
                  message: This phone number is not registered with a FoodGO restaurant. Ask the restaurant to register you in person.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/otp/verify:
    post:
      tags: [Auth]
      operationId: verifyOtp
      summary: Verify the SMS code and sign the customer in
      description: Step 2 of customer sign-in — verifies the one-time code, consumes the challenge and opens a CUSTOMER session (BR-05, FR-03). Public.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
            example:
              challengeId: otp_K7M2QX9RT4HB
              code: '482913'
      responses:
        '200':
          description: Signed in as CUSTOMER. The token is returned and set as the `fg_session` cookie.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInResponse'
              example:
                token: Zr8EXAMPLEtokenBase64Url_c3VwZXJzZWNyZXQtc2Vzc2lvbg
                session:
                  role: CUSTOMER
                  subjectId: cus_9QW4T7KPMX2H
                  restaurantId: null
                  fullName: Omar Trabelsi
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: AUTH-001 — unknown, expired, already used or exhausted challenge (5 attempts), or wrong code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: { code: AUTH-001, message: Invalid or expired code }
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/signout:
    post:
      tags: [Auth]
      operationId: signOut
      summary: Sign out
      description: Deletes the current session (if any) and clears the fg_session cookie (SDD §5.2.1). Works with or without a valid session.
      security:
        - {}
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '204':
          description: Signed out (also returned when there was no session).
          headers:
            Set-Cookie:
              description: Clears the session cookie.
              schema:
                type: string
                example: 'fg_session=; Path=/; Expires=Thu, 01 Jan 1970 00:00:00 GMT'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/session:
    get:
      tags: [Auth]
      operationId: getSession
      summary: Current session
      description: Describes the signed-in principal with display name and restaurant name (SDD §5.2.1). Any role.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: The current session.
          content:
            application/json:
              schema:
                type: object
                required: [session]
                properties:
                  session:
                    $ref: '#/components/schemas/SessionDetail'
              examples:
                staff:
                  summary: Staff member of Dar Lella
                  value:
                    session:
                      role: STAFF
                      subjectId: stf_8MZQ4RTK2HXA
                      restaurantId: rst_4H7KQ2M9XPTB
                      fullName: Sonia Gharbi
                      restaurantName: Dar Lella
                customer:
                  summary: Customer
                  value:
                    session:
                      role: CUSTOMER
                      subjectId: cus_9QW4T7KPMX2H
                      restaurantId: null
                      fullName: Omar Trabelsi
                      restaurantName: null
        '401':
          description: AUTH-001 — not signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: { code: AUTH-001, message: Not signed in }
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------------------------------------------------------------- Customer
  /customer/me:
    get:
      tags: [Customer]
      operationId: getCustomerProfile
      summary: My profile
      description: Returns the signed-in customer's own record and organization (SDD §5.1.2). CUSTOMER only.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: The customer's profile.
          content:
            application/json:
              schema:
                type: object
                required: [profile]
                properties:
                  profile:
                    $ref: '#/components/schemas/CustomerProfile'
              example:
                profile:
                  customerId: cus_9QW4T7KPMX2H
                  fullName: Omar Trabelsi
                  phoneNumber: '+21698333444'
                  organization:
                    organizationId: org_3RX7K2PQ9MTB
                    name: Lac 2 Tech Park
                    type: WORKPLACE
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /customer/restaurants:
    get:
      tags: [Customer]
      operationId: listMyRestaurants
      summary: Restaurants that registered me
      description: Lists the active restaurants where the customer holds an active, eligible membership, with today's deadline status (UC-05, FR-05, BR-04, BR-16). CUSTOMER only.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: The customer's restaurants, ordered by name.
          content:
            application/json:
              schema:
                type: object
                required: [restaurants]
                properties:
                  restaurants:
                    type: array
                    items:
                      $ref: '#/components/schemas/CustomerRestaurant'
              example:
                restaurants:
                  - restaurantId: rst_4H7KQ2M9XPTB
                    name: Dar Lella
                    address: Rue du Lac Léman, Les Berges du Lac, Tunis
                    paymentMethods: [CASH_ON_DELIVERY, E_PAYMENT]
                    orderingDeadline: '23:30'
                    orderingOpen: true
                    minutesLeft: 856
                    serviceDate: '2026-11-02'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /customer/restaurants/{restaurantId}/menu:
    get:
      tags: [Customer]
      operationId: getCustomerMenu
      summary: Menu of one of my restaurants
      description: Returns the restaurant summary and its menu; unavailable items are listed but cannot be ordered (UC-06, FR-06, FR-08, BR-04, BR-16). CUSTOMER only.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/RestaurantIdPath'
      responses:
        '200':
          description: Restaurant summary and menu items (removed items excluded), ordered by name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerMenu'
              example:
                restaurant:
                  restaurantId: rst_4H7KQ2M9XPTB
                  name: Dar Lella
                  address: Rue du Lac Léman, Les Berges du Lac, Tunis
                  paymentMethods: [CASH_ON_DELIVERY, E_PAYMENT]
                  orderingDeadline: '23:30'
                  orderingOpen: true
                  minutesLeft: 856
                  serviceDate: '2026-11-02'
                items:
                  - menuItemId: item_B2K9QX7MRT4H
                    name: "Brik à l'oeuf"
                    description: Crispy pastry with egg, tuna and parsley
                    price: 3.5
                    priceMillimes: 3500
                    available: true
                  - menuItemId: item_7TPM3KQ2XH9R
                    name: Couscous au poulet
                    description: Friday classic, with vegetables and chickpeas
                    price: 14.5
                    priceMillimes: 14500
                    available: true
                  - menuItemId: item_Q4HX8MT2KP7B
                    name: Kafteji
                    description: Fried vegetables, egg and chopped peppers
                    price: 8
                    priceMillimes: 8000
                    available: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: AUTH-002 — caller is not a CUSTOMER, or has no active eligible membership at this restaurant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: { code: AUTH-002, message: You are not registered with this restaurant }
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------------------------------------------------------------- Orders (customer)
  /customer/orders:
    post:
      tags: [Orders]
      operationId: submitOrder
      summary: Submit a pre-order
      description: Submits a morning pre-order atomically (transaction T1) — membership, deadline, availability, total, payment (UC-01, FR-09–FR-15, FR-25, FR-26, BR-01, BR-02, BR-04, BR-13, BR-16, I-3, D-02, D-04). CUSTOMER only.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: |
            Optional duplicate-submission protection. A retry by the same customer with the
            same key returns the **original** order with `200` instead of creating a second
            one (the request body is still validated but otherwise not compared, and
            deadline/availability are not re-checked). Without the header every call
            creates a new order. A malformed key is rejected with `400 VAL-001`
            ("Invalid Idempotency-Key").
          schema:
            type: string
            pattern: '^[A-Za-z0-9-]{8,64}$'
          example: 3f6c2a1e-9b4d-4c7a-8e21-5d0f7b6a9c13
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitOrderRequest'
            example:
              restaurantId: rst_4H7KQ2M9XPTB
              items:
                - menuItemId: item_7TPM3KQ2XH9R
                  quantity: 1
                - menuItemId: item_B2K9QX7MRT4H
                  quantity: 2
                - menuItemId: item_C9RM4TK7QX2P
                  quantity: 1
              paymentMethod: CASH_ON_DELIVERY
      responses:
        '201':
          description: Order created and confirmed. `OrderSubmitted` and `OrderConfirmed` events are published after commit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitOrderResponse'
              examples:
                created:
                  $ref: '#/components/examples/SubmitOrderBody'
        '200':
          description: Replay — an order with this `Idempotency-Key` already exists for this customer; its current state is returned and nothing new is created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitOrderResponse'
              examples:
                replayed:
                  $ref: '#/components/examples/SubmitOrderBody'
        '400':
          description: |
            VAL-001 — body violates the schema, malformed JSON, invalid `Idempotency-Key`,
            an item is not on this restaurant's menu (or was removed), more than 50 of one
            item after merging repeated lines, or the payment method is not enabled at this
            restaurant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                schema:
                  value:
                    error: { code: VAL-001, message: 'items: an order needs at least one item' }
                notOnMenu:
                  value:
                    error: { code: VAL-001, message: "An item is not on this restaurant's menu" }
                paymentMethod:
                  value:
                    error: { code: VAL-001, message: This payment method is not available at this restaurant }
                idempotencyKey:
                  value:
                    error: { code: VAL-001, message: Invalid Idempotency-Key }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentFailed'
        '403':
          description: AUTH-002 — caller is not a CUSTOMER, or has no active eligible membership at this restaurant (BR-04, BR-16).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: { code: AUTH-002, message: You are not registered with this restaurant }
        '409':
          $ref: '#/components/responses/OrderConflict'
        '422':
          $ref: '#/components/responses/OrderCreationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/PaymentUnavailable'
    get:
      tags: [Orders]
      operationId: listMyOrders
      summary: My orders
      description: Lists the customer's own orders, newest first, at most 50 (UC-12, SDD §5.2.1). CUSTOMER only.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: The customer's orders.
          content:
            application/json:
              schema:
                type: object
                required: [orders]
                properties:
                  orders:
                    type: array
                    maxItems: 50
                    items:
                      $ref: '#/components/schemas/Order'
              examples:
                myOrders:
                  $ref: '#/components/examples/MyOrdersBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /customer/orders/{orderId}:
    get:
      tags: [Orders]
      operationId: getMyOrder
      summary: One of my orders
      description: Returns one of the customer's own orders with items and delivery progress (UC-12, SDD §5.2.1). CUSTOMER only.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderIdPath'
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema:
                type: object
                required: [order]
                properties:
                  order:
                    $ref: '#/components/schemas/Order'
              examples:
                submitted:
                  $ref: '#/components/examples/MyOrderSubmittedBody'
                outForDelivery:
                  $ref: '#/components/examples/MyOrderOutForDeliveryBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------------------------------------------------------------- Orders (restaurant queue)
  /restaurants/{restaurantId}/orders:
    get:
      tags: [Restaurant, Orders]
      operationId: listRestaurantOrders
      summary: Restaurant order queue for a service day
      description: Lists the restaurant's orders for one service day with customer verification info and allowed next statuses (FR-15, FR-16). STAFF of this restaurant only.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/RestaurantIdPath'
        - name: date
          in: query
          required: false
          description: Service date (restaurant-local, `YYYY-MM-DD`). Defaults to today; a value not matching the pattern is ignored (today is used) rather than rejected.
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          example: '2026-11-02'
      responses:
        '200':
          description: Orders of that service day, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [orders]
                properties:
                  orders:
                    type: array
                    items:
                      $ref: '#/components/schemas/RestaurantOrder'
              examples:
                queue:
                  $ref: '#/components/examples/RestaurantQueueBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenRestaurant'
        '500':
          $ref: '#/components/responses/InternalError'

  /restaurants/{restaurantId}/orders/{orderId}/start-preparation:
    post:
      tags: [Restaurant, Orders]
      operationId: startPreparation
      summary: Start preparing an order
      description: Moves a SUBMITTED order to IN_PREPARATION through the order state machine and publishes OrderStatusChanged (FR-15, FR-16, D-09). STAFF of this restaurant only.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/RestaurantIdPath'
        - $ref: '#/components/parameters/OrderIdPath'
      responses:
        '200':
          description: The updated order as it appears in the restaurant queue.
          content:
            application/json:
              schema:
                type: object
                required: [order]
                properties:
                  order:
                    $ref: '#/components/schemas/RestaurantOrder'
              examples:
                inPreparation:
                  $ref: '#/components/examples/RestaurantOrderInPreparationBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenRestaurant'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: DEL-001 — the order is not in a status that can go to IN_PREPARATION.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: { code: DEL-001, message: An order cannot go from IN_PREPARATION to IN_PREPARATION }
        '500':
          $ref: '#/components/responses/InternalError'

  /restaurants/{restaurantId}/orders/{orderId}/assign:
    post:
      tags: [Restaurant, Orders]
      operationId: assignOrder
      summary: Assign an order to one of the restaurant's delivery personnel
      description: Creates the delivery assignment and moves the order to ASSIGNED in one transaction T2 (UC-02 step 1, FR-19, BR-06, BR-10, I-8; re-assignment unresolved Q-20). STAFF of this restaurant only.
