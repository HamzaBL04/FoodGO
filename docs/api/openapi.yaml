        '200':
          description: Registered customers.
          content:
            application/json:
              schema:
                type: object
                required: [customers]
                properties:
                  customers:
                    type: array
                    items:
                      $ref: '#/components/schemas/RestaurantCustomerSummary'
              example:
                customers:
                  - customerId: cus_9QW4T7KPMX2H
                    fullName: Omar Trabelsi
                    phoneNumber: '+21698333444'
                    organizationName: Lac 2 Tech Park
                    eligible: true
