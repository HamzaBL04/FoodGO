  # ---------------------------------------------------------------- Restaurant (staff)
  /restaurants/{restaurantId}/settings:
    get:
      tags: [Restaurant]
      operationId: getRestaurantSettings
      summary: Restaurant settings
      description: Returns the ordering deadline and payment-method settings (FR-12, FR-13, FR-26). STAFF of this restaurant only.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/RestaurantIdPath'
      responses:
        '200':
          description: The settings.
          content:
            application/json:
              schema:
                type: object
                required: [settings]
                properties:
                  settings:
                    $ref: '#/components/schemas/RestaurantSettings'
              example:
                settings:
                  restaurantId: rst_4H7KQ2M9XPTB
                  name: Dar Lella
                  address: Rue du Lac Léman, Les Berges du Lac, Tunis
                  orderingDeadline: '23:30'
                  cashOnDeliveryEnabled: true
                  ePaymentEnabled: true
                  paymentMethods: [CASH_ON_DELIVERY, E_PAYMENT]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenRestaurant'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Restaurant]
      operationId: updateRestaurantSettings
      summary: Update restaurant settings
      description: Replaces the ordering deadline and enabled payment methods; at least one method must stay enabled, and placed orders keep their deadline snapshot (FR-12, FR-13, FR-26, BR-12, D-04). STAFF of this restaurant only.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/RestaurantIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUpdateRequest'
            example:
              orderingDeadline: '10:30'
              cashOnDeliveryEnabled: true
              ePaymentEnabled: false
      responses:
        '200':
          description: The updated settings.
          content:
            application/json:
              schema:
                type: object
                required: [settings]
                properties:
                  settings:
                    $ref: '#/components/schemas/RestaurantSettings'
              example:
                settings:
                  restaurantId: rst_4H7KQ2M9XPTB
                  name: Dar Lella
                  address: Rue du Lac Léman, Les Berges du Lac, Tunis
                  orderingDeadline: '10:30'
                  cashOnDeliveryEnabled: true
                  ePaymentEnabled: false
                  paymentMethods: [CASH_ON_DELIVERY]
        '400':
          description: VAL-001 — schema violation (e.g. deadline not HH:MM) or both payment methods disabled (BR-12).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                deadline:
                  value:
                    error: { code: VAL-001, message: 'orderingDeadline: must be HH:MM' }
                br12:
                  value:
                    error: { code: VAL-001, message: At least one payment method must stay enabled (BR-12) }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenRestaurant'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

