  # ---------------------------------------------------------------- Events
  /events:
    get:
      tags: [Events]
      operationId: streamEvents
      summary: Live order status stream (Server-Sent Events)
      description: Long-lived SSE stream of order events the caller may see — customers their own orders, staff their own restaurant, delivery people their own assignments; admins get none (FR-24, E-01–E-05, BR-15, D-08). CUSTOMER, STAFF or DELIVERY.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: |
            An open `text/event-stream` (`Cache-Control: no-cache`). The stream starts with
            `retry: 3000`, sends a `: ping` comment every 25 s, and emits events only after the
            underlying transaction has committed (D-08). Each event is

            ```
            event: <type>
            data: {"type":"<type>","orderId":"FG-7K2P9Q","status":"<order status>","at":"<ISO-8601>"}
            ```

            The payload is deliberately minimal (`type`, `orderId`, `status`, `at`); clients
            fetch details through the REST endpoints.

            | `type` | Raised when | `status` carried | Visible to |
            |---|---|---|---|
            | `OrderSubmitted` (E-01) | order created | `SUBMITTED` | customer, staff |
            | `OrderConfirmed` (E-02) | order confirmed (right after submission) | `SUBMITTED` | customer, staff |
            | `DeliveryAssigned` (E-03) | staff assigned a delivery person | `ASSIGNED` | customer, staff, assignee |
            | `DeliveryStatusChanged` (E-04) | delivery started / confirmed | `OUT_FOR_DELIVERY` or `DELIVERED` | customer, staff, assignee |
            | `PaymentStatusChanged` (E-05) | cash marked collected at delivery | `DELIVERED` (order status) | customer, staff, assignee |
            | `OrderStatusChanged` | any order status change | new order status | customer, staff; assignee only for changes made through delivery management (`ASSIGNED`, `OUT_FOR_DELIVERY`, `DELIVERED`) |

            When the client disconnects the subscription is released.
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE frames; each `data:` line is a JSON-encoded `OrderEvent`.
              example: |
                retry: 3000

                event: OrderStatusChanged
                data: {"type":"OrderStatusChanged","orderId":"FG-7K2P9Q","status":"IN_PREPARATION","at":"2026-11-02T10:31:07.221Z"}

                : ping

                event: DeliveryAssigned
                data: {"type":"DeliveryAssigned","orderId":"FG-7K2P9Q","status":"ASSIGNED","at":"2026-11-02T10:45:12.010Z"}

        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: AUTH-002 — the caller's role (ADMIN) may not subscribe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: { code: AUTH-002, message: Authorization denied }
        '500':
          $ref: '#/components/responses/InternalError'

# =====================================================================
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Session token returned by `/auth/signin` or `/auth/otp/verify`, sent as `Authorization Bearer <token>`. Takes precedence over the cookie.
    cookieAuth:
      type: apiKey
      in: cookie
      name: fg_session
      description: HttpOnly, SameSite=Lax session cookie set by sign-in (12 h; Secure in production).

  headers:
    SetSessionCookie:
      description: Sets the session cookie (HttpOnly, SameSite=Lax, Path=/, 12 hours; `Secure` in production).
      schema:
        type: string
        example: 'fg_session=3q2-7wEXAMPLEtokenBase64Url_Hq9vK1mZ0aL4sT8uYcR2dN6; Max-Age=43200; Path=/; HttpOnly; SameSite=Lax'

  parameters:
    RestaurantIdPath:
      name: restaurantId
      in: path
      required: true
      description: Restaurant id. In staff paths it must equal the caller's own restaurant, else `403 AUTH-002`.
      schema:
        type: string
      example: rst_4H7KQ2M9XPTB
    OrderIdPath:
      name: orderId
      in: path
      required: true
      description: Customer-facing order number (FR-14).
      schema:
        type: string
        pattern: '^FG-[2-9A-HJKMNP-Z]{6}$'
      example: FG-7K2P9Q
    MenuItemIdPath:
      name: menuItemId
      in: path
      required: true
      schema:
        type: string
      example: item_7TPM3KQ2XH9R
    CustomerIdPath:
      name: customerId
      in: path
      required: true
      schema:
        type: string
      example: cus_9QW4T7KPMX2H
    AssignmentIdPath:
      name: assignmentId
      in: path
      required: true
      description: Assignment id; must belong to the calling delivery person, else `404`.
      schema:
        type: string
      example: asg_T4KQ9MX2RH7P

  responses:
    BadRequest:
      description: VAL-001 — invalid input (schema violation, malformed JSON or business validation). Only the first issue is reported.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: { code: VAL-001, message: 'name: Too small: expected string to have >=2 characters' }
    Unauthorized:
      description: AUTH-001 — not signed in (no, unknown or expired session token).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: { code: AUTH-001, message: Sign in required }
    Forbidden:
      description: AUTH-002 — the caller's role may not use this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: { code: AUTH-002, message: Authorization denied }
    ForbiddenRestaurant:
      description: AUTH-002 — caller is not STAFF, or the path `restaurantId` is not the caller's own restaurant.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            otherRestaurant:
              value:
                error: { code: AUTH-002, message: You can only act on your own restaurant }
            wrongRole:
              value:
                error: { code: AUTH-002, message: Authorization denied }
    NotFound:
      description: NOT-FOUND — the resource does not exist within the caller's scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: { code: NOT-FOUND, message: Order not found }
    OrderConflict:
      description: ORDER-001 — today's ordering deadline has passed (BR-01; a request at or after the deadline instant is refused), or ORDER-002 — a requested item is currently unavailable (BR-02).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            deadline:
              summary: ORDER-001
              value:
                error: { code: ORDER-001, message: 'Ordering for today closed at 10:30' }
            unavailable:
              summary: ORDER-002
              value:
                error: { code: ORDER-002, message: Couscous au poulet is currently unavailable }
    DeliveryConflict:
      description: DEL-001 — delivery operation refused (person not employed by / not active at this restaurant, order already assigned, or status transition not allowed).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notYourCourier:
              value:
                error: { code: DEL-001, message: This delivery person does not work for your restaurant }
            alreadyAssigned:
              value:
                error: { code: DEL-001, message: This order is already assigned }
            transition:
              value:
                error: { code: DEL-001, message: An order cannot go from DELIVERED to ASSIGNED }
    OrderCreationFailed:
      description: ORDER-003 — the restaurant is not taking orders (not ACTIVE).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: { code: ORDER-003, message: Restaurant is not taking orders }
    PaymentFailed:
      description: PAY-001 — e-payment capture declined; the whole order is rolled back (BR-13).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: { code: PAY-001, message: The payment was declined by the provider (sandbox) }
    PaymentUnavailable:
      description: PAY-002 — the e-payment provider is unavailable; nothing was created.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: { code: PAY-002, message: Payment provider unavailable }
    TooManyRequests:
      description: Rate limit on `/auth/*` exceeded (200 requests per 15 minutes per client). Note the body uses code AUTH-001 with HTTP 429. IETF draft-7 `RateLimit` / `RateLimit-Policy` headers are sent on every `/auth` response.
      headers:
        RateLimit:
          schema:
            type: string
            example: 'limit=200, remaining=0, reset=742'
        RateLimit-Policy:
          schema:
            type: string
            example: '200;w=900'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: { code: AUTH-001, message: Too many attempts, try again later }
    InternalError:
      description: SYS-001 — unexpected server error (no stack trace or SQL is returned).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: { code: SYS-001, message: Internal system error }

  schemas:

    # ------------------------------------------------------------ common
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [AUTH-001, AUTH-002, VAL-001, ORDER-001, ORDER-002, ORDER-003, PAY-001, PAY-002, DEL-001, NOT-FOUND, SYS-001]
            message:
              type: string
              description: Safe, user-facing detail.
      example:
        error: { code: VAL-001, message: 'items: an order needs at least one item' }

    Role:
      type: string
      enum: [CUSTOMER, STAFF, DELIVERY, ADMIN]

    MoneyTnd:
      type: number
      description: Amount in Tunisian dinars (TND) with at most 3 decimals (millime precision). Not expressed as `multipleOf` to avoid floating-point false negatives in validators; use the matching `*Millimes` integer where exactness matters.
      example: 24.5

    Millimes:
      type: integer
      description: Exact amount in millimes (1 TND = 1000 millimes).
      example: 24500

    Timestamp:
      type: string
      format: date-time
      description: ISO-8601 UTC timestamp.
      example: '2026-11-02T08:14:03.512Z'

    ServiceDate:
      type: string
      format: date
      description: Restaurant-local service day (Africa/Tunis), YYYY-MM-DD.
      example: '2026-11-02'

    Hhmm:
      type: string
      pattern: '^([01]\d|2[0-3]):([0-5]\d)$'
      description: Restaurant-local wall-clock time, HH:MM (24 h).
      example: '10:30'

    TunisianPhone:
      type: string
      pattern: '^\+216\d{8}$'
      description: Tunisian phone number in E.164 form, +216 followed by 8 digits (trimmed).
      example: '+21698333444'

    PaymentMethod:
      type: string
      enum: [CASH_ON_DELIVERY, E_PAYMENT]

    PaymentStatus:
      type: string
      enum: [PENDING, PAID]
      description: Cash on delivery stays PENDING until cash is recorded at delivery; e-payment is PAID at checkout.

    OrderStatus:
      type: string
      enum: [SUBMITTED, IN_PREPARATION, ASSIGNED, OUT_FOR_DELIVERY, DELIVERED]
      description: |
        Happy-path lifecycle (PROPOSED, D-05):
        SUBMITTED -> IN_PREPARATION -> ASSIGNED -> OUT_FOR_DELIVERY -> DELIVERED,
        and a restaurant may assign straight from SUBMITTED. Cancelled/failed states are unresolved and absent.

    OrderStatusLabel:
      type: string
      enum: [Order received, Being prepared, Delivery person assigned, On the way, Delivered]

    AssignmentStatus:
      type: string
      enum: [ASSIGNED, STARTED, COMPLETED]

    OrganizationType:
      type: string
      enum: [WORKPLACE, CAMPUS, INSTITUTION]

    # ------------------------------------------------------------ meta / auth
    Meta:
      type: object
      required: [name, version, demoMode]
      properties:
        name:
          type: string
          example: FoodGO
        version:
          type: string
          example: 0.1.0
        demoMode:
          type: boolean
          description: When true, `/auth/otp/request` echoes the code as `demoCode`.

    SignInRequest:
      type: object
      required: [role, identity, password]
      properties:
        role:
          type: string
          enum: [STAFF, DELIVERY, ADMIN]
        identity:
          type: string
          minLength: 3
          maxLength: 120
          description: Login identity (e-mail or user name), trimmed.
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 128

    OtpRequest:
      type: object
      required: [phoneNumber]
      properties:
        phoneNumber:
          $ref: '#/components/schemas/TunisianPhone'

    OtpChallenge:
      type: object
      required: [challengeId, expiresInSeconds]
      properties:
        challengeId:
          type: string
          example: otp_K7M2QX9RT4HB
        expiresInSeconds:
          type: integer
          example: 300
        demoCode:
          type: string
          pattern: '^\d{6}$'
          description: The code itself — present only in demo mode.

    OtpVerifyRequest:
      type: object
      required: [challengeId, code]
      properties:
        challengeId:
          type: string
          minLength: 5
        code:
          type: string
          pattern: '^\d{6}$'
          description: The 6-digit code received by SMS.

    Session:
      type: object
      description: The signed-in principal.
      required: [role, subjectId, restaurantId]
      properties:
        role:
          $ref: '#/components/schemas/Role'
        subjectId:
          type: string
          description: Id of the account (staffId, deliveryPersonId, adminId or customerId).
          example: stf_8MZQ4RTK2HXA
        restaurantId:
          type: string
          nullable: true
          description: The bound restaurant for STAFF and DELIVERY; null for CUSTOMER and ADMIN.
          example: rst_4H7KQ2M9XPTB
        fullName:
          type: string
          example: Sonia Gharbi

    SessionDetail:
      allOf:
        - $ref: '#/components/schemas/Session'
        - type: object
          required: [restaurantName]
          properties:
            restaurantName:
              type: string
              nullable: true
              example: Dar Lella

    SignInResponse:
      type: object
      required: [token, session]
      properties:
        token:
          type: string
          description: Opaque session token (base64url). Use as Bearer token; also set as the fg_session cookie.
        session:
          $ref: '#/components/schemas/Session'

    # ------------------------------------------------------------ menu / restaurant
    MenuItem:
      type: object
      required: [menuItemId, name, description, price, priceMillimes, available]
      properties:
        menuItemId:
          type: string
          example: item_7TPM3KQ2XH9R
        name:
          type: string
          example: Couscous au poulet
        description:
          type: string
          example: Friday classic, with vegetables and chickpeas
        price:
          $ref: '#/components/schemas/MoneyTnd'
        priceMillimes:
          $ref: '#/components/schemas/Millimes'
        available:
          type: boolean

    MenuItemCreateRequest:
      type: object
      required: [name, price]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
          description: Trimmed.
        description:
          type: string
          maxLength: 240
          default: ''
          description: Trimmed.
        price:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 1000
          description: Price in TND; stored rounded to the nearest millime.
        available:
          type: boolean
          default: true

    MenuItemPatchRequest:
      type: object
      minProperties: 1
      description: At least one of the fields is required.
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        description:
          type: string
          maxLength: 240
        price:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 1000
        available:
          type: boolean

    RestaurantSettings:
      type: object
      required: [restaurantId, name, address, orderingDeadline, cashOnDeliveryEnabled, ePaymentEnabled, paymentMethods]
      properties:
        restaurantId:
          type: string
        name:
          type: string
        address:
          type: string
          nullable: true
        orderingDeadline:
          $ref: '#/components/schemas/Hhmm'
        cashOnDeliveryEnabled:
          type: boolean
        ePaymentEnabled:
          type: boolean
        paymentMethods:
          type: array
          description: Enabled methods, derived from the two flags.
          items:
            $ref: '#/components/schemas/PaymentMethod'

    SettingsUpdateRequest:
      type: object
      required: [orderingDeadline, cashOnDeliveryEnabled, ePaymentEnabled]
      description: Full replacement. At least one payment method must be true (BR-12), checked after schema validation.
      properties:
        orderingDeadline:
          $ref: '#/components/schemas/Hhmm'
        cashOnDeliveryEnabled:
          type: boolean
        ePaymentEnabled:
          type: boolean

    RestaurantRecord:
      type: object
      description: Raw restaurant record as returned by the admin interface (flags are 0/1 integers).
      required: [restaurantId, name, status, orderingDeadline, accessRules, cashOnDeliveryEnabled, ePaymentEnabled, address]
      properties:
        restaurantId:
          type: string
        name:
          type: string
        status:
          type: string
          example: ACTIVE
        orderingDeadline:
          $ref: '#/components/schemas/Hhmm'
        accessRules:
          type: string
          example: ORGANIZATION_MEMBERS_ONLY
        cashOnDeliveryEnabled:
          type: integer
          enum: [0, 1]
        ePaymentEnabled:
          type: integer
          enum: [0, 1]
        address:
          type: string
          nullable: true

    RestaurantCreateRequest:
      type: object
      required: [name, orderingDeadline]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
          description: Trimmed.
        orderingDeadline:
          $ref: '#/components/schemas/Hhmm'
        address:
          type: string
          maxLength: 200
          description: Trimmed.

    DeadlineInfo:
      type: object
      required: [orderingDeadline, orderingOpen, minutesLeft, serviceDate]
      properties:
        orderingDeadline:
          $ref: '#/components/schemas/Hhmm'
        orderingOpen:
          type: boolean
          description: True while now is strictly before today's deadline.
        minutesLeft:
          type: integer
          minimum: 0
          description: Whole minutes until the deadline; 0 when closed.
        serviceDate:
          $ref: '#/components/schemas/ServiceDate'

    CustomerRestaurant:
      allOf:
        - type: object
          required: [restaurantId, name, address, paymentMethods]
          properties:
            restaurantId:
              type: string
            name:
              type: string
            address:
              type: string
              nullable: true
            paymentMethods:
              type: array
              items:
                $ref: '#/components/schemas/PaymentMethod'
        - $ref: '#/components/schemas/DeadlineInfo'

    CustomerMenu:
      type: object
      required: [restaurant, items]
      properties:
        restaurant:
          $ref: '#/components/schemas/CustomerRestaurant'
        items:
          type: array
          items:
            $ref: '#/components/schemas/MenuItem'

    # ------------------------------------------------------------ customers / organizations
    Organization:
      type: object
      required: [organizationId, name, type, status]
      properties:
        organizationId:
          type: string
        name:
          type: string
        type:
          $ref: '#/components/schemas/OrganizationType'
        status:
          type: string
          example: ACTIVE

    OrganizationCreateRequest:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
          description: Trimmed; unique case-insensitively.
        type:
          $ref: '#/components/schemas/OrganizationType'

    CustomerProfile:
      type: object
      required: [customerId, fullName, phoneNumber, organization]
      properties:
        customerId:
          type: string
        fullName:
          type: string
        phoneNumber:
          $ref: '#/components/schemas/TunisianPhone'
        organization:
          type: object
          required: [organizationId, name, type]
          properties:
            organizationId:
              type: string
            name:
              type: string
            type:
              $ref: '#/components/schemas/OrganizationType'

    MembershipStatus:
      type: string
      enum: [ACTIVE, SUSPENDED]

    RestaurantCustomerSummary:
      type: object
      required: [customerId, fullName, phoneNumber, organizationName, eligible, status, registeredAt]
      properties:
        customerId:
          type: string
        fullName:
          type: string
        phoneNumber:
          $ref: '#/components/schemas/TunisianPhone'
        organizationName:
          type: string
        eligible:
          type: boolean
          description: This restaurant's eligibility decision (BR-04).
        status:
          $ref: '#/components/schemas/MembershipStatus'
        registeredAt:
          $ref: '#/components/schemas/Timestamp'

    RestaurantCustomerDetail:
      allOf:
        - $ref: '#/components/schemas/RestaurantCustomerSummary'
        - type: object
          required: [organizationId, organizationType]
          properties:
            organizationId:
              type: string
            organizationType:
              $ref: '#/components/schemas/OrganizationType'

    RegisteredCustomer:
      allOf:
        - $ref: '#/components/schemas/RestaurantCustomerDetail'
        - type: object
          required: [existingPerson]
          properties:
            existingPerson:
              type: boolean
              description: True when the phone number already belonged to a customer; only a membership was added (D-01).

    RegisterCustomerRequest:
      type: object
      required: [fullName, phoneNumber, organizationId, identityVerified]
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 80
          description: Trimmed. Ignored if the phone number already belongs to a customer.
        phoneNumber:
          $ref: '#/components/schemas/TunisianPhone'
        organizationId:
          type: string
          minLength: 3
        eligible:
          type: boolean
          default: true
        identityVerified:
          type: boolean
          enum: [true]
          description: Must be `true` — identity must be verified in person before registration (BR-05).

    CustomerPatchRequest:
      type: object
      minProperties: 1
      description: At least one of the fields is required.
      properties:
        eligible:
          type: boolean
        status:
          $ref: '#/components/schemas/MembershipStatus'

    # ------------------------------------------------------------ accounts
    StaffAccount:
      type: object
      required: [staffId, restaurantId, identity, fullName, status]
      properties:
        staffId:
          type: string
        restaurantId:
          type: string
        identity:
          type: string
        fullName:
          type: string
        status:
          type: string
          example: ACTIVE

    StaffAccountListItem:
      allOf:
        - $ref: '#/components/schemas/StaffAccount'
        - type: object
          required: [restaurantName]
          properties:
            restaurantName:
              type: string

    StaffCreateRequest:
      type: object
      required: [restaurantId, identity, fullName, password]
      properties:
        restaurantId:
          type: string
          minLength: 3
        identity:
          type: string
          minLength: 3
          maxLength: 120
          description: Trimmed; unique across staff, delivery and admin accounts.
        fullName:
          type: string
          minLength: 2
          maxLength: 80
          description: Trimmed.
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128

    DeliveryPerson:
      type: object
      required: [deliveryPersonId, restaurantId, identity, fullName, phoneNumber, status]
      properties:
        deliveryPersonId:
          type: string
        restaurantId:
          type: string
        identity:
          type: string
        fullName:
          type: string
        phoneNumber:
          type: string
          nullable: true
        status:
          type: string
          example: ACTIVE

    DeliveryPersonCreateRequest:
      type: object
      required: [identity, fullName, password]
      properties:
        identity:
          type: string
          minLength: 3
          maxLength: 120
          description: Trimmed; unique across staff, delivery and admin accounts.
        fullName:
          type: string
          minLength: 2
          maxLength: 80
          description: Trimmed.
        phoneNumber:
          $ref: '#/components/schemas/TunisianPhone'
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128

    # ------------------------------------------------------------ orders
    SubmitOrderRequest:
      type: object
      required: [restaurantId, items, paymentMethod]
      properties:
        restaurantId:
          type: string
          minLength: 3
        items:
          type: array
          minItems: 1
          maxItems: 30
          description: Lines with the same menuItemId are merged; the merged quantity may not exceed 50.
          items:
            type: object
            required: [menuItemId, quantity]
            properties:
              menuItemId:
                type: string
                minLength: 3
              quantity:
                type: integer
                minimum: 1
                maximum: 50
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'

    SubmitOrderResponse:
      type: object
      required: [order, confirmation]
      properties:
        order:
          $ref: '#/components/schemas/Order'
        confirmation:
          type: string
          example: Order FG-7K2P9Q confirmed

    OrderItem:
      type: object
      required: [menuItemId, name, quantity, unitPrice, lineTotal]
      properties:
        menuItemId:
          type: string
        name:
          type: string
          description: Name snapshot taken at order time (D-02).
        quantity:
          type: integer
          minimum: 1
          maximum: 50
        unitPrice:
          allOf:
            - $ref: '#/components/schemas/MoneyTnd'
          description: Unit price snapshot at order time (D-02).
        lineTotal:
          allOf:
            - $ref: '#/components/schemas/MoneyTnd'
          description: quantity x unitPrice (derived, not stored).

    OrderDelivery:
      type: object
      description: Delivery progress of an order.
      required: [assignmentId, status, deliveryPersonName, assignedAt, startedAt, completedAt]
      properties:
        assignmentId:
          type: string
        status:
          $ref: '#/components/schemas/AssignmentStatus'
        deliveryPersonName:
          type: string
        assignedAt:
          $ref: '#/components/schemas/Timestamp'
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true

    Order:
      type: object
      required: [orderId, restaurantId, status, statusLabel, total, totalMillimes, paymentMethod, paymentStatus, createdAt, serviceDate, deadlineSnapshot, items, delivery]
      properties:
        orderId:
          type: string
          pattern: '^FG-[2-9A-HJKMNP-Z]{6}$'
          description: Customer-facing order number, readable over the phone (FR-14).
          example: FG-7K2P9Q
        restaurantId:
          type: string
        restaurantName:
          type: string
          description: Present in customer views; absent in restaurant-queue views.
        status:
          $ref: '#/components/schemas/OrderStatus'
        statusLabel:
          $ref: '#/components/schemas/OrderStatusLabel'
        total:
          $ref: '#/components/schemas/MoneyTnd'
        totalMillimes:
          $ref: '#/components/schemas/Millimes'
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        paymentStatus:
          $ref: '#/components/schemas/PaymentStatus'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        serviceDate:
          $ref: '#/components/schemas/ServiceDate'
        deadlineSnapshot:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: The ordering deadline instant in force when the order was placed (D-04).
        items:
          type: array
          description: Ordered by item name.
          items:
            $ref: '#/components/schemas/OrderItem'
        delivery:
          nullable: true
          description: Null until the order is assigned.
          allOf:
            - $ref: '#/components/schemas/OrderDelivery'

    RestaurantOrder:
      description: An order as seen in the restaurant queue, with what staff need to verify the customer (FR-16).
      allOf:
        - $ref: '#/components/schemas/Order'
        - type: object
          required: [customer, allowedNext]
          properties:
            customer:
              type: object
              required: [customerId, fullName, phoneNumber, organizationName, eligible]
              properties:
                customerId:
                  type: string
                fullName:
                  type: string
                phoneNumber:
                  $ref: '#/components/schemas/TunisianPhone'
                organizationName:
                  type: string
                eligible:
                  type: boolean
            allowedNext:
              type: array
              description: Statuses the order may move to next (guards still apply).
              items:
                $ref: '#/components/schemas/OrderStatus'

    AssignRequest:
      type: object
      required: [deliveryPersonId]
      properties:
        deliveryPersonId:
          type: string
          minLength: 3
          description: Must be an ACTIVE delivery person of this restaurant (I-8).

    # ------------------------------------------------------------ delivery
    Assignment:
      type: object
      description: One row of a delivery person's assignment list.
      required: [assignmentId, orderId, status, orderStatus, orderStatusLabel, customerName, destination, total, paymentMethod, paymentStatus, assignedAt, completedAt]
      properties:
        assignmentId:
          type: string
        orderId:
          type: string
        status:
          $ref: '#/components/schemas/AssignmentStatus'
        orderStatus:
          $ref: '#/components/schemas/OrderStatus'
        orderStatusLabel:
          $ref: '#/components/schemas/OrderStatusLabel'
        customerName:
          type: string
        destination:
          type: string
          description: The customer's registered organization (PROPOSED, Q-02).
        total:
          $ref: '#/components/schemas/MoneyTnd'
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        paymentStatus:
          $ref: '#/components/schemas/PaymentStatus'
        assignedAt:
          $ref: '#/components/schemas/Timestamp'
        completedAt:
          type: string
          format: date-time
          nullable: true

    AssignmentDetail:
      type: object
      description: Exactly the information needed to complete one delivery (FR-21, BR-15).
      required: [assignmentId, status, assignedAt, startedAt, completedAt, order, pickup, customer, payment]
      properties:
        assignmentId:
          type: string
        status:
          $ref: '#/components/schemas/AssignmentStatus'
        assignedAt:
          $ref: '#/components/schemas/Timestamp'
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        order:
          type: object
          required: [orderId, status, statusLabel, items, total]
          properties:
            orderId:
              type: string
            status:
              $ref: '#/components/schemas/OrderStatus'
            statusLabel:
              $ref: '#/components/schemas/OrderStatusLabel'
            items:
              type: array
              items:
                $ref: '#/components/schemas/OrderItem'
            total:
              $ref: '#/components/schemas/MoneyTnd'
        pickup:
          type: object
          required: [restaurantName, address]
          properties:
            restaurantName:
              type: string
            address:
              type: string
              nullable: true
        customer:
          type: object
          required: [fullName, phoneNumber, destination]
          properties:
            fullName:
              type: string
            phoneNumber:
              $ref: '#/components/schemas/TunisianPhone'
            destination:
              type: string
              description: The customer's registered workplace or campus (PROPOSED, Q-02).
        payment:
          type: object
          required: [method, status, amountToCollect]
          properties:
            method:
              $ref: '#/components/schemas/PaymentMethod'
            status:
              $ref: '#/components/schemas/PaymentStatus'
            amountToCollect:
              allOf:
                - $ref: '#/components/schemas/MoneyTnd'
              description: Order total for unpaid cash-on-delivery orders, otherwise 0.

    ConfirmDeliveryRequest:
      type: object
      description: Optional body. Only `cashCollected` = true marks a cash-on-delivery payment PAID; omitted or false leaves it PENDING. Ignored for e-payment.
      properties:
        cashCollected:
          type: boolean

    # ------------------------------------------------------------ forecast
    ForecastDish:
      type: object
      required: [menuItemId, name, available, expected, low, high, confidence, alreadyOrdered, samples]
      properties:
        menuItemId:
          type: string
        name:
          type: string
        available:
          type: boolean
        expected:
          type: integer
          minimum: 0
          description: Expected number of portions.
        low:
          type: integer
          minimum: 0
        high:
          type: integer
          minimum: 0
        confidence:
          type: string
          enum: [low, medium, high]
          description: high = 4 same-weekday samples, medium = 2–3, low = fewer.
        alreadyOrdered:
          type: integer
          minimum: 0
          description: Portions already pre-ordered for the service date.
        samples:
          type: object
          required: [sameWeekday, recentDays]
          properties:
            sameWeekday:
              type: integer
              minimum: 0
              maximum: 4
            recentDays:
              type: integer
              minimum: 0
              maximum: 7

    ForecastAccuracy:
      type: object
      description: Backtest over the last 7 service days (only when at least 10 days of history exist).
      required: [days, meanAbsoluteError, meanAbsolutePercentError]
      properties:
        days:
          type: array
          items:
            type: object
            required: [day, predicted, actual, absError]
            properties:
              day:
                $ref: '#/components/schemas/ServiceDate'
              predicted:
                type: integer
              actual:
                type: integer
              absError:
                type: integer
        meanAbsoluteError:
          type: number
          description: One decimal.
        meanAbsolutePercentError:
          type: number
          nullable: true
          description: One decimal; null when nothing was sold.

    Forecast:
      type: object
      description: Advisory demand forecast (FR-31 PROPOSED). Never changes any order, payment, eligibility or menu item.
      required: [restaurantName, serviceDate, weekday, historyDays, totals, dishes, accuracy, note, method, summary, summarySource, advisory]
      properties:
        restaurantName:
          type: string
        serviceDate:
          allOf:
            - $ref: '#/components/schemas/ServiceDate'
          description: Next day the kitchen prepares for (today if ordering is still open, otherwise the next usual opening day).
        weekday:
          type: string
          enum: [Sunday, Monday, Tuesday, Wednesday, Thursday, Friday, Saturday]
        historyDays:
          type: integer
          minimum: 0
          description: Service days with sales in the 35-day history window.
        totals:
          type: object
          required: [expected, low, high, alreadyOrdered]
          properties:
            expected:
              type: integer
            low:
              type: integer
            high:
              type: integer
            alreadyOrdered:
              type: integer
        dishes:
          type: array
          description: Sorted by expected, descending.
          items:
            $ref: '#/components/schemas/ForecastDish'
        accuracy:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ForecastAccuracy'
        note:
          type: string
          nullable: true
          description: Explains when the forecast skipped to the next usual opening day.
        method:
          type: string
        summary:
          type: string
          description: Plain-language prep advice (LLM or template).
        summarySource:
          type: string
          description: '`template`, or `claude (<model>)` when the LLM produced the summary.'
          example: template
        advisory:
          type: string
          example: AI-assisted advice. The restaurant decides what to prepare.

    # ------------------------------------------------------------ admin
    AuditEvent:
      type: object
      required: [auditId, at, actorRole, actorId, restaurantId, action, entity, entityId, detail]
      properties:
        auditId:
          type: integer
        at:
          $ref: '#/components/schemas/Timestamp'
        actorRole:
          type: string
        actorId:
          type: string
        restaurantId:
          type: string
          nullable: true
        action:
          type: string
          example: ORDER_SUBMITTED
        entity:
          type: string
          nullable: true
        entityId:
          type: string
          nullable: true
        detail:
          type: string
          nullable: true
          description: JSON-encoded details, if any.

    Monitor:
      type: object
      required: [serviceDate, totals, restaurants, recentEvents]
      properties:
        serviceDate:
          $ref: '#/components/schemas/ServiceDate'
        totals:
          type: object
          required: [restaurants, customers, staff, deliveryPersonnel, ordersTotal]
          properties:
            restaurants:
              type: integer
            customers:
              type: integer
            staff:
              type: integer
            deliveryPersonnel:
              type: integer
            ordersTotal:
              type: integer
        restaurants:
          type: array
          items:
            type: object
            required: [restaurantId, name, today]
            properties:
              restaurantId:
                type: string
              name:
                type: string
              today:
                type: object
                description: Count of today's orders per order status; statuses with no orders are omitted.
                additionalProperties:
                  type: integer
        recentEvents:
          type: array
          maxItems: 30
          description: Most recent audit events first.
          items:
            $ref: '#/components/schemas/AuditEvent'

    # ------------------------------------------------------------ events
    OrderEvent:
      type: object
      description: Minimal payload of each SSE `data:` line on `GET /events`.
      required: [type, orderId, status, at]
      properties:
        type:
          type: string
          enum: [OrderSubmitted, OrderConfirmed, DeliveryAssigned, DeliveryStatusChanged, PaymentStatusChanged, OrderStatusChanged]
        orderId:
          type: string
          example: FG-7K2P9Q
        status:
          $ref: '#/components/schemas/OrderStatus'
        at:
          $ref: '#/components/schemas/Timestamp'

  # ------------------------------------------------------------ shared examples
  # Whole response bodies, referenced from media types with `examples: {name: {$ref}}`.
  examples:
    SubmitOrderBody:
      summary: Omar's pre-order at Dar Lella (cash on delivery)
